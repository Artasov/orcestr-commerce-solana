[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "orcestr-commerce-solana"
version = "0.1.0"
description = "Non-custodial native SOL and Token-2022 payments for CommerceXL."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MPL-2.0"
license-files = ["LICENSE", "NOTICE", "TRADEMARKS.md"]
authors = [
    { name = "Artasov" },
]
urls = { Homepage = "https://github.com/Artasov/orcestr-commerce-solana", Repository = "https://github.com/Artasov/orcestr-commerce-solana", Issues = "https://github.com/Artasov/orcestr-commerce-solana/issues" }
keywords = [
    "commercexl",
    "payments",
    "solana",
    "solana-pay",
    "token-2022",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = [
    "commercexl>=0.3.1,<0.4",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.11,<3",
    "solders>=0.29,<0.30",
    "sqlalchemy>=2.0,<3",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.21,<1",
    "build>=1.3,<2",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/orcestr_commerce_solana"]

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/README.ru.md",
    "/LICENSE",
    "/NOTICE",
    "/TRADEMARKS.md",
    "/pyproject.toml",
    "/uv.lock",
    "/src",
    "/docs",
    "/tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
