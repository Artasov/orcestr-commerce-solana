name: Publish npm package
run-name: Publish npm package - ${{ inputs.package && format('commerce-solana-{0}-v{1}', inputs.package, inputs.version) || github.ref_name }}

on:
  push:
    tags:
      - 'commerce-solana-core-v*'
      - 'commerce-solana-react-v*'
      - 'commerce-solana-ui-v*'
  workflow_dispatch:
    inputs:
      package:
        description: npm package to publish
        required: true
        type: choice
        options:
          - core
          - react
          - ui
      version:
        description: Existing package tag version to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve npm release
    runs-on: ubuntu-latest
    outputs:
      package_dir: ${{ steps.release.outputs.package_dir }}
      package_name: ${{ steps.release.outputs.package_name }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        name: Resolve package and version from tag
        shell: bash
        env:
          DISPATCH_PACKAGE: ${{ inputs.package }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_ref="commerce-solana-${DISPATCH_PACKAGE}-v${DISPATCH_VERSION}"
          else
            release_ref="$GITHUB_REF_NAME"
          fi

          case "$release_ref" in
            commerce-solana-core-v*)
              package_dir="frontend/packages/core"
              package_name="@orcestr/commerce-solana-core"
              version="${release_ref#commerce-solana-core-v}"
              ;;
            commerce-solana-react-v*)
              package_dir="frontend/packages/react"
              package_name="@orcestr/commerce-solana-react"
              version="${release_ref#commerce-solana-react-v}"
              ;;
            commerce-solana-ui-v*)
              package_dir="frontend/packages/ui"
              package_name="@orcestr/commerce-solana-ui"
              version="${release_ref#commerce-solana-ui-v}"
              ;;
            *)
              echo "Unsupported release tag: $release_ref" >&2
              exit 1
              ;;
          esac

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported release version: $version" >&2
            exit 1
          fi

          echo "package_dir=$package_dir" >> "$GITHUB_OUTPUT"
          echo "package_name=$package_name" >> "$GITHUB_OUTPUT"
          echo "tag=$release_ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify ${{ needs.resolve.outputs.package_name }}
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 0
      - name: Verify annotated tag is merged to main
        shell: bash
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          if [[ "$(git cat-file -t "$TAG")" != "tag" ]]; then
            echo "Release ref $TAG must be an annotated tag." >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Release tag $TAG is not contained in origin/main." >&2
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Use Trusted Publishing compatible npm
        run: npm install --global npm@11.6.2
      - name: Check package version against tag
        shell: bash
        working-directory: frontend
        env:
          EXPECTED: ${{ needs.resolve.outputs.version }}
          PACKAGE_JSON: ${{ needs.resolve.outputs.package_dir }}/package.json
        run: |
          node - <<'NODE'
          const fs = require('node:fs');

          const manifest = JSON.parse(fs.readFileSync(`../${process.env.PACKAGE_JSON}`, 'utf8'));
          if (manifest.version !== process.env.EXPECTED) {
            throw new Error(`Package version ${manifest.version} does not match tag ${process.env.EXPECTED}`);
          }
          NODE
      - name: Verify exact published workspace dependencies
        shell: bash
        working-directory: frontend
        env:
          PACKAGE_JSON: ${{ needs.resolve.outputs.package_dir }}/package.json
        run: |
          node - <<'NODE'
          const {execFileSync} = require('node:child_process');
          const fs = require('node:fs');

          const manifest = JSON.parse(fs.readFileSync(`../${process.env.PACKAGE_JSON}`, 'utf8'));
          const dependencies = Object.entries(manifest.dependencies ?? {})
            .filter(([name]) => name.startsWith('@orcestr/commerce-solana-'));

          for (const [name, expected] of dependencies) {
            if (!/^\d+\.\d+\.\d+$/.test(expected)) {
              throw new Error(`${name} must use an exact stable version, got ${expected}`);
            }
            const actual = execFileSync(
              'npm',
              ['view', `${name}@${expected}`, 'version'],
              {encoding: 'utf8'},
            ).trim();
            if (actual !== expected) {
              throw new Error(`${name}@${expected} is not available in npm`);
            }
          }
          NODE
      - name: Install, test and build workspace
        working-directory: frontend
        run: |
          npm ci
          npm test
      - name: Inspect target package tarball
        working-directory: frontend
        env:
          PACKAGE_NAME: ${{ needs.resolve.outputs.package_name }}
        run: npm pack --dry-run --workspace "$PACKAGE_NAME"

  publish:
    name: Publish ${{ needs.resolve.outputs.package_name }}
    needs: [resolve, verify]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Use Trusted Publishing compatible npm
        run: npm install --global npm@11.6.2
      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Publish target package or validate manual first release
        id: publish
        shell: bash
        working-directory: frontend
        env:
          PACKAGE_NAME: ${{ needs.resolve.outputs.package_name }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          registry_error="$(mktemp)"
          trap 'rm -f "$registry_error"' EXIT
          set +e
          published_version="$(npm view "${PACKAGE_NAME}@${VERSION}" version 2>"$registry_error")"
          view_status=$?
          set -e

          if [[ $view_status -eq 0 ]]; then
            if [[ "$published_version" != "$VERSION" ]]; then
              echo "Registry returned unexpected version: $published_version" >&2
              exit 1
            fi

            local_head="$(git rev-parse HEAD)"
            published_head="$(npm view "${PACKAGE_NAME}@${VERSION}" gitHead 2>/dev/null || true)"
            if [[ -z "$published_head" || "$published_head" != "$local_head" ]]; then
              echo "Published package gitHead is missing or does not match release tag" >&2
              exit 1
            fi

            echo "Package already exists and matches this release; skipping duplicate publish."
            echo "published=false" >> "$GITHUB_OUTPUT"
          elif grep -q "E404" "$registry_error"; then
            npm publish --workspace "$PACKAGE_NAME" --access public --provenance
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            cat "$registry_error" >&2
            echo "Could not determine whether the package version exists." >&2
            exit 1
          fi

  github-release:
    name: Create npm GitHub release
    needs: [resolve, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ needs.resolve.outputs.package_name }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          package_url="https://www.npmjs.com/package/${PACKAGE_NAME}/v/${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists."
          else
            gh release create "$TAG" \
              --verify-tag \
              --title "${PACKAGE_NAME} v${VERSION}" \
              --notes "npm: ${package_url}" \
              --generate-notes
          fi
